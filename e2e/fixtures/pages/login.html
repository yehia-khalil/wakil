<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in</title></head>
<body>
<h1>Sign in</h1>
<!-- The fields have no name, so the GET sends no value: no password reaches the tab's URL. -->
<form action="signed-in.html" method="get">
  <p><label for="username">Username</label> <input id="username" type="text" autocomplete="username"></p>
  <p><label for="password">Password</label> <input id="password" type="password" autocomplete="current-password"></p>
  <p><button type="submit">Sign in</button></p>
</form>
</body></html>
