<!doctype html>
<html><head><meta charset="utf-8"><title>Booking form</title></head>
<body>
<h1>Booking form</h1>
<form action="done.html" method="get">
  <p><label for="guest">Guest name</label> <input id="guest" type="text" name="guest"></p>
  <p><label for="nights">Stay</label>
    <select id="nights" name="nights">
      <option value="1">One night</option>
      <option value="2">Two nights</option>
    </select></p>
  <p><label for="card">Card number</label> <input id="card" type="text" name="card" autocomplete="cc-number"></p>
  <p><label for="password">Password</label> <input id="password" type="password" name="password"></p>
  <p><button type="submit">Confirm</button></p>
</form>
<p><a href="a.html">Back to page A</a></p>
</body></html>
