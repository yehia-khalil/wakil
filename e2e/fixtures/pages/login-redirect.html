<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in, then away</title></head>
<body>
<h1>Sign in</h1>
<form action="signed-in.html" method="get">
  <p><label for="username">Username</label> <input id="username" type="text" autocomplete="username"></p>
  <p><label for="password">Password</label> <input id="password" type="password" autocomplete="current-password"></p>
  <p><button type="submit">Sign in</button></p>
</form>
<!-- 1 s after load the page goes to a.html: a fill chosen after that is refused. -->
<script>
  window.addEventListener('load', function () {
    setTimeout(function () { location.href = 'a.html'; }, 1000);
  });
</script>
</body></html>
