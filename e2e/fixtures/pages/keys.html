<!doctype html>
<html><head><meta charset="utf-8"><title>Keys</title></head>
<body><h1>Keys</h1>
<p>This page takes ⌘K and ⌘P for itself, as a web app with its own command bar does.</p>
<script>
// Without Wakil's own key routing a focused page swallows these, and the palette never opens.
document.addEventListener('keydown', (e) => {
  if (e.metaKey && (e.key === 'k' || e.key === 'p')) { e.preventDefault(); document.title = 'Keys ' + e.key; }
}, true);
</script>
</body></html>
