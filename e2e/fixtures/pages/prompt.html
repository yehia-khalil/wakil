<!doctype html>
<html><head><meta charset="utf-8"><title>Prompt</title></head>
<body><h1>Prompt</h1>
<p id="out">Waiting</p>
<script>
// A page's own question (window.prompt), answered in place: the answer, or Cancel, lands here.
window.addEventListener('load', () => {
  const name = prompt('What is your name?', '');
  document.getElementById('out').textContent = name === null ? 'Cancelled' : 'Named ' + name;
});
</script>
</body></html>
