<!doctype html>
<html><head><meta charset="utf-8"><title>Two videos</title></head>
<body>
<h1>Two videos</h1>
<video id="first" src="clip.mp4" muted autoplay loop playsinline width="320" height="180"></video>
<video id="second" src="clip.mp4" muted loop playsinline width="320" height="180"></video>
<script>
// `second` starts a second after `first`, so it is the one playing most recently.
const second = document.getElementById('second');
setTimeout(() => { second.play().catch(() => {}); }, 1000);
for (const video of document.querySelectorAll('video')) {
  video.addEventListener('enterpictureinpicture', () => { document.title = 'Floating: ' + video.id; });
  video.addEventListener('leavepictureinpicture', () => { document.title = 'Two videos'; });
}
</script>
</body></html>
