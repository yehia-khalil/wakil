<!doctype html>
<html><head><meta charset="utf-8"><title>Create an account</title></head>
<body>
<h1>Create an account</h1>
<form action="signed-in.html" method="get">
  <p><label for="username">Username</label> <input id="username" type="text" autocomplete="username"></p>
  <p><label for="new">Password</label> <input id="new" type="password" autocomplete="new-password"></p>
  <p><label for="confirm">Confirm password</label> <input id="confirm" type="password" autocomplete="new-password"></p>
  <p><button type="submit">Create</button></p>
</form>
</body></html>
