<!doctype html>
<html><head><meta charset="utf-8"><title>Framed video</title></head>
<body>
<h1>Framed video</h1>
<iframe id="frame" width="360" height="300" allow="autoplay; picture-in-picture"></iframe>
<script>
// video.html under the other loopback name on the same port, so the frame is cross-origin.
const other = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
document.getElementById('frame').src = 'http://' + other + ':' + location.port + '/video.html' + location.search;
</script>
</body></html>
