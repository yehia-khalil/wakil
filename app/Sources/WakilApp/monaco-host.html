<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body,#d{margin:0;height:100%;background:#0b0d14}
#dd{position:absolute;inset:0;display:none;background:#0b0d14}
.monaco-hover a[data-href="command:wakil.blame.web"]{color:#4fb9e8}
.wakil-mark-added{border-left:3px solid #8be0c8;margin-left:4px}
.wakil-mark-changed{border-left:3px solid #e8b45a;margin-left:4px}
.wakil-mark-deletedBelow,.wakil-mark-deletedAbove{position:relative}
.wakil-mark-deletedBelow::after,.wakil-mark-deletedAbove::after{content:'';position:absolute;left:3px;border:4px solid transparent;border-left-color:rgba(232,236,246,.45)}
.wakil-mark-deletedBelow::after{bottom:-4px}
.wakil-mark-deletedAbove::after{top:-4px}
.wakil-peek{pointer-events:auto;background:#11141e;border-top:1px solid #2a2f40;border-bottom:1px solid #2a2f40;font:12px Menlo,monospace}
.wakil-peek-head{display:flex;gap:10px;padding:2px 8px;color:rgba(232,236,246,.62);font-size:11px}
.wakil-peek-head button{all:unset;cursor:pointer;white-space:nowrap;color:rgba(232,236,246,.9)}
.wakil-peek-old{color:rgba(232,236,246,.45);padding-left:8px;white-space:pre}
.wakil-peek-new{color:#8be0c8;padding-left:8px;white-space:pre}
/* 3b-viii: the dot that pulses at the caret while a slow ghost-text request waits (the ghost's own
   ink is the theme's editorGhostText.foreground: Monaco's !important rule loads after this sheet). */
.ghost-pending{position:relative}
.ghost-pending::after{content:'';position:absolute;left:1px;top:45%;width:2px;height:2px;border-radius:50%;background:rgba(232,236,246,0.34);animation:ghost-pulse 1s ease-in-out infinite}
@keyframes ghost-pulse{0%,100%{opacity:.25}50%{opacity:1}}
/* 3a-v-a: inline blame, dim, after the cursor line's text. */
.wakil-blame{color:rgba(232,236,246,.32)!important;font-style:normal;cursor:default}
/* 3a-v-b: a conflict block — current green, incoming blue, its marker lines stronger and each with a
   dim suffix — and the actions row above it, laid over a one-line view zone as the peek is. */
.wakil-conflict-current-head{background:rgba(139,224,200,.24)}
.wakil-conflict-current{background:rgba(139,224,200,.10)}
.wakil-conflict-incoming{background:rgba(92,157,255,.10)}
.wakil-conflict-incoming-head{background:rgba(92,157,255,.24)}
.wakil-conflict-label{color:rgba(232,236,246,.38)!important;font-style:normal}
.wakil-conflict-row{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:0 8px;color:rgba(232,236,246,.38);font:11px Menlo,monospace}
.wakil-conflict-row button{all:unset;cursor:pointer;white-space:nowrap;color:rgba(232,236,246,.72)}
.wakil-conflict-row button:hover{color:#e8ecf6}
/* Ticket view (design A, cards with state): a review thread is a quiet card under its line, laid
   over a view zone as tall as the card. Its left edge carries §5's meaning only: amber while it waits
   on you, green once resolved (and the card dims); violet hairlines are where the keyboard is. */
.wakil-review{pointer-events:auto;box-sizing:border-box;padding:3px 18px 6px 4px;color:#e8ecf6;font:12.5px -apple-system,BlinkMacSystemFont,sans-serif;outline:none;overflow:hidden}
.wakil-review ::selection{background:rgba(124,92,255,.35)}
.wakil-review-card{background:rgba(232,236,246,.035);border:1px solid rgba(232,236,246,.08);border-left:2px solid rgba(232,236,246,.16);border-radius:6px;padding:8px 10px}
.wakil-review-waiting .wakil-review-card{border-left-color:#e8b45a}
.wakil-review-resolved .wakil-review-card{border-left-color:#8be0c8;opacity:.65}
.wakil-review:focus .wakil-review-card,.wakil-review:focus-within .wakil-review-card{background:rgba(232,236,246,.055);border-top-color:rgba(124,92,255,.45);border-right-color:rgba(124,92,255,.45);border-bottom-color:rgba(124,92,255,.45)}
.wakil-review-resolved:focus .wakil-review-card,.wakil-review-resolved:focus-within .wakil-review-card{opacity:.85}
.wakil-review-head{display:flex;gap:7px;align-items:center;white-space:nowrap;overflow:hidden;color:rgba(232,236,246,.45);font-size:11px}
.wakil-review-avatar{flex:none;width:16px;height:16px;border-radius:50%;background:#2a2f44;color:#e8ecf6;font:600 9px -apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center}
.wakil-review-author{color:#e8ecf6;font-weight:600}
.wakil-review-pos{margin-left:auto;display:flex;align-items:center;gap:6px;font:10.5px Menlo,monospace;font-variant-numeric:tabular-nums}
.wakil-review-note{color:#e8b45a}
.wakil-review-text{white-space:pre-wrap;word-break:break-word;margin:5px 0 7px 23px;line-height:1.45}
.wakil-review-reply{margin:2px 0 6px 23px;padding-left:9px;border-left:1px solid rgba(232,236,246,.1)}
.wakil-review-reply .wakil-review-text{margin-left:0;margin-bottom:4px}
.wakil-review-actions{display:flex;align-items:center;gap:6px;margin:0 0 0 23px;white-space:nowrap;overflow:hidden;color:rgba(232,236,246,.45);font-size:11px}
.wakil-review-actions + .wakil-review-actions{margin-top:6px}
.wakil-review > .wakil-review-card > .wakil-review-note{margin:0 0 6px 23px;white-space:pre-wrap;word-break:break-word}
.wakil-review button{all:unset;box-sizing:border-box;cursor:pointer;white-space:nowrap;font-size:11px;line-height:16px;padding:1px 9px;border-radius:5px;border:1px solid rgba(232,236,246,.16);color:#e8ecf6}
.wakil-review button:hover{background:rgba(232,236,246,.06)}
.wakil-review button.wakil-review-primary{border-color:rgba(124,92,255,.6);color:#cfc3ff}
.wakil-review button.wakil-review-primary:hover{background:rgba(124,92,255,.12)}
.wakil-review button.wakil-review-fold{padding:0;border:0;color:rgba(232,236,246,.62)}
.wakil-review button.wakil-review-fold:hover{background:none;color:#e8ecf6}
.wakil-review button.wakil-review-kbd{font:10px Menlo,monospace;line-height:14px;padding:0 4px;border-radius:3px;border-color:rgba(232,236,246,.2);color:rgba(232,236,246,.6)}
.wakil-review button:focus-visible{outline:1px solid #7c5cff;outline-offset:1px}
.wakil-review button[disabled]{cursor:default;color:rgba(232,236,246,.38);border-color:rgba(232,236,246,.08);background:none}
/* Who wrote a draft: an agent's is captioned over its field, dim, as a head's time is. */
.wakil-review-draft-by{margin:0 0 3px 23px;color:rgba(232,236,246,.45);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wakil-review textarea{display:block;box-sizing:border-box;width:calc(100% - 23px);min-height:54px;margin:2px 0 7px 23px;padding:6px 8px;resize:vertical;background:#0b0d14;color:#e8ecf6;caret-color:#9e82ff;border:1px solid rgba(232,236,246,.12);border-radius:5px;font:12.5px/1.45 -apple-system,BlinkMacSystemFont,sans-serif;outline:none}
.wakil-review textarea::placeholder{color:rgba(232,236,246,.38)}
.wakil-review textarea:focus{border-color:rgba(124,92,255,.6)}
/* The line a waiting thread is on: a faint amber wash, and an amber dot in the gutter. */
.wakil-review-line{background:rgba(232,180,90,.07)}
.wakil-review-gutter::before{content:'';position:absolute;top:50%;right:3px;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#e8b45a}
</style></head>
<body><div id="d"></div>
<script>
  // Diagnostics: errors and warnings from the page
  // (Monaco's worker fallback, a failed module load) reach the app as
  // {type:'log'} instead of vanishing into an uninspectable web view.
  (function () {
    function post(level, text) {
      try { window.webkit.messageHandlers.wakil.postMessage({ type: 'log', level: level, text: String(text) }); } catch (e) {}
    }
    function fmt(args) {
      return Array.prototype.map.call(args, function (a) {
        if (a instanceof Error) return a.name + ': ' + a.message + (a.stack ? '\n' + a.stack : '');
        if (typeof a === 'object') { try { return JSON.stringify(a); } catch (e) { return String(a); } }
        return String(a);
      }).join(' ');
    }
    window.onerror = function (msg, src, line, col, err) {
      post('error', 'onerror: ' + msg + ' at ' + src + ':' + line + ':' + col + (err && err.stack ? '\n' + err.stack : ''));
    };
    window.addEventListener('unhandledrejection', function (e) {
      post('error', 'unhandledrejection: ' + fmt([e.reason]));
    });
    ['error', 'warn'].forEach(function (level) {
      const orig = console[level];
      console[level] = function () { post(level, fmt(arguments)); return orig.apply(console, arguments); };
    });
    window.wakilLog = post;
    post('info', 'page script started');
  })();
</script>
<script>
  // Monaco's diff runs in a web worker. A file: page has origin "null", so
  // the loader cannot resolve the worker's relative URL and Monaco falls back
  // to computing diffs on the main thread. Hand it a same-origin blob worker
  // that sets its base URL and imports workerMain.js by absolute file URL.
  (function () {
    const base = new URL('monaco/', location.href).href;
    self.MonacoEnvironment = {
      getWorkerUrl: function () {
        const src = 'self.MonacoEnvironment = { baseUrl: ' + JSON.stringify(base) + ' };\n' +
          'importScripts(' + JSON.stringify(base + 'vs/base/worker/workerMain.js') + ');';
        return URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      }
    };
  })();
</script>
<script src="monaco/vs/loader.js"></script>
<script>
  require.config({ paths: { vs: 'monaco/vs' } });
  require(['vs/editor/editor.main'], function () {
    monaco.editor.defineTheme('wakil', {
      base: 'vs-dark', inherit: true, rules: [
        // 3b-vii: a log's levels, in §5's red and amber; its timestamps and traces dimmed.
        { token: 'log-time', foreground: '7d8396' },
        { token: 'log-trace', foreground: '7d8396' },
        { token: 'log-error', foreground: 'e85c5c' },
        { token: 'log-warn', foreground: 'e8b45a' }
      ],
      colors: {
        'editor.background': '#0b0d14',
        'diffEditor.insertedTextBackground': '#8be0c82a',
        'diffEditor.insertedLineBackground': '#8be0c814',
        'diffEditor.removedTextBackground': '#c9a0a024',
        'diffEditor.removedLineBackground': '#c9a0a012',
        // §5's find bar (3b-ii): Wakil's slab, hairlines and violet, not vs-dark's blue.
        'editorWidget.background': '#11141e',
        'editorWidget.border': '#2a2f40',
        'input.background': '#0b0d14',
        'input.foreground': '#e8ecf6',
        'input.border': '#2a2f40',
        'inputOption.activeBorder': '#7c5cff',
        'inputOption.activeBackground': '#7c5cff33',
        'focusBorder': '#7c5cff',
        'editor.findMatchBackground': '#7c5cff55',
        'editor.findMatchHighlightBackground': '#7c5cff26',
        'editor.findRangeHighlightBackground': '#7c5cff14',
        // 3b-viii: ghost-text in §5's dim ink, rgba(232,236,246,0.34).
        'editorGhostText.foreground': '#e8ecf657'
      }
    });
    // One editable editor, one model per tab key, each keeping its own undo, and (3b-iii) the
    // pane's diff editor beside it. The app's own edits land with `applying` set, so they are not
    // reported back as typing.
    const post = function (m) { window.webkit.messageHandlers.wakil.postMessage(m); };
    const ed = monaco.editor.create(document.getElementById('d'), {
      theme: 'wakil', automaticLayout: true, minimap: { enabled: false },
      fontFamily: 'Menlo, monospace', fontSize: 12, model: null, lineDecorationsWidth: 10,
      inlineSuggest: { enabled: true, mode: 'subword' }
    });
    // 3b-iii: the pane's diff editor, in the same page as the code editor — a diff tab and Compare
    // show here. The active tab chooses which is visible; no second page is ever loaded.
    const codeHost = document.getElementById('d');
    const dd = document.createElement('div'); dd.id = 'dd'; document.body.appendChild(dd);
    const diff = monaco.editor.createDiffEditor(dd, {
      theme: 'wakil', readOnly: true, originalEditable: false, renderSideBySide: false,
      automaticLayout: true, minimap: { enabled: false }, fontFamily: 'Menlo, monospace', fontSize: 12
    });
    const dme = diff.getModifiedEditor();
    let diffKey = null;        // what the diff editor shows; null while the code editor is visible or mid-swap
    let diffScroll = null;     // re-applied once a shown diff is computed (its view zones move it)
    let diffReveal = null;     // a line brought into view once the shown diff is computed (a review thread's)
    diff.onDidUpdateDiff(function () {
      if (diffReveal !== null) {
        const ln = diffReveal;
        diffReveal = null; diffScroll = null;
        dme.revealLineInCenterIfOutsideViewport(ln);
        reportDiff();
        return;
      }
      if (diffScroll === null) return;
      const top = diffScroll;
      dme.setScrollTop(top);
      diffScroll = null;
      reportDiff();
    });
    // The diff's cursor and scroll, under its key: the window's open-file command opens the file at
    // the cursor's line, and a tab shown again lands where it was left. The visible lines go with
    // them (the store keeps a scroll only beside them). A scroll still waiting for the diff to be
    // computed is reported as the one it will be, never the top it passes through.
    function reportDiff() {
      if (!diffKey) return;
      const p = dme.getPosition(), sel = dme.getSelection(), vr = dme.getVisibleRanges();
      post({ type: 'view', key: diffKey, cursor: p ? { line: p.lineNumber, column: p.column } : { line: 1, column: 1 },
             // 3a-ii-b: the primary selection, which enables Stage / Unstage Selected Ranges.
             selection: (sel && !sel.isEmpty()) ? { start: { line: sel.startLineNumber, column: sel.startColumn },
                                                    end: { line: sel.endLineNumber, column: sel.endColumn } } : null,
             visible: vr.length ? { first: vr[0].startLineNumber, last: vr[vr.length - 1].endLineNumber } : null,
             scrollTop: diffScroll !== null ? diffScroll : dme.getScrollTop() });
    }
    dme.onDidChangeCursorPosition(reportDiff);
    dme.onDidChangeCursorSelection(reportDiff);
    // 3a-ii-b: every selection of the diff's modified side, read when Stage / Unstage Selected
    // Ranges is pressed (ruling R1); a caret is a one-line selection.
    function diffSelections() {
      return (dme.getSelections() || []).map(function (s) {
        return { startLine: s.startLineNumber, startColumn: s.startColumn, endLine: s.endLineNumber, endColumn: s.endColumn };
      });
    }
    window.wakilDiffSelections = function () { return JSON.stringify(diffSelections()); };
    // The right-click entries, shown on the group each one takes: a diff tab's key is
    // `diff:<group>:<root>/<path>` (EditorRenderer's key), so the group is read off it.
    const onChangedDiff = dme.createContextKey('wakilChangedDiff', false);
    const onStagedDiff = dme.createContextKey('wakilStagedDiff', false);
    function rangesAction(id, label, when, op) {
      dme.addAction({ id: id, label: label, precondition: when, contextMenuGroupId: 'navigation', contextMenuOrder: 0,
                      run: function () { if (diffKey) post({ type: 'ranges', key: diffKey, op: op, selections: diffSelections() }); } });
    }
    rangesAction('wakil.stageRanges', 'Stage Selected Ranges', 'wakilChangedDiff', 'stage');
    rangesAction('wakil.unstageRanges', 'Unstage Selected Ranges', 'wakilStagedDiff', 'unstage');
    dme.onDidScrollChange(function (e) { if (e.scrollTopChanged) reportDiff(); });
    function showCode() { dd.style.display = 'none'; codeHost.style.display = 'block'; diffKey = null; }
    // The same key again (a refresh) keeps the diff's own cursor and scroll; another key lands at the
    // tab's (line, column, top). `diffKey` is null across the swap, so the fresh models' reset to 1:1
    // is reported under neither key; then one report says where the new key's view is.
    window.wakilShowDiff = function (key, original, modified, language, line, column, top) {
      ed.changeViewZones(function (acc) { dropPeek(acc); dropConflictRows(acc); dropReviewBoxes(acc, true); });
      const same = key === diffKey;
      const at = same ? dme.getPosition() : { lineNumber: line, column: column };
      const scroll = same ? (diffScroll !== null ? diffScroll : dme.getScrollTop()) : top;
      diffKey = null;
      const old = diff.getModel();
      diff.setModel({ original: monaco.editor.createModel(original, language),
                      modified: monaco.editor.createModel(modified, language) });
      if (old) { old.original.dispose(); old.modified.dispose(); }
      current = null;          // the code editor reports nothing while it is hidden
      codeHost.style.display = 'none';
      dd.style.display = 'block';
      diff.layout();
      const m = diff.getModel().modified;
      const ln = Math.min(Math.max(at ? at.lineNumber : 1, 1), m.getLineCount());
      dme.setPosition({ lineNumber: ln, column: Math.min(Math.max(at ? at.column : 1, 1), m.getLineMaxColumn(ln)) });
      dme.setScrollTop(scroll);
      diffScroll = scroll;
      // A tab opened at a line (a review thread's, in its PR-head tab) lands with that line in view.
      if (!same && !scroll && ln > 1) diffReveal = ln;
      diffKey = key;
      // Ticket view: a PR-head tab's review boxes, drawn on the diff's file side.
      dme.changeViewZones(function (acc) { drawReviewBoxes(acc, key, dme); });
      onChangedDiff.set(key.indexOf('diff:changed:') === 0);
      onStagedDiff.set(key.indexOf('diff:staged:') === 0);
      reportDiff();
    };
    // The keys the app asks for (editorCapturedKeys), taken before Monaco's own and posted back.
    let captured = [];
    window.wakilCaptureKeys = function (keys) { captured = keys; };
    window.addEventListener('keydown', function (e) {
      if (!captured.length || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
      if (inReview(e.target)) return;   // a review box's field types its own arrows
      const key = { ArrowUp: 'up', ArrowDown: 'down', Escape: 'escape' }[e.key];
      if (!key || captured.indexOf(key) < 0) return;
      e.preventDefault();
      e.stopPropagation();
      post({ type: 'key', key: key });
    }, true);
    const models = {};          // key -> model
    // The tab key a model is shown under (a rename moves the model to its new key, wakilRekey).
    function keyOfModel(model) {
      for (const k in models) if (models[k] === model) return k;
      return null;
    }
    let current = null;         // key shown in the code editor
    let applying = false;       // true while the app's own edit lands: not reported back as typing
    let typingTimer = null;
    // key -> the agent-edit serial this page has applied (wakilSetBasis, queued right after the
    // edit itself), posted with the text so the store can drop a post made before an edit landed.
    const basis = {};
    // 3b-vii: Laravel-style logs. An entry starts at a [date time] line and runs to the next.
    const logEntry = /^\[\d{4}-\d{2}-\d{2}[ T][^\]]*\]/;
    monaco.languages.register({ id: 'log' });
    monaco.languages.setMonarchTokensProvider('log', { tokenizer: { root: [
      [/^\[\d{4}-\d{2}-\d{2}[ T][^\]]*\]/, 'log-time'],
      [/\.(EMERGENCY|ALERT|CRITICAL|ERROR):/, 'log-error'],
      [/\.WARNING:/, 'log-warn'],
      [/^(#\d+ |\[stacktrace\]).*$/, 'log-trace'],
      [/[^\[.#]+/, ''],
      [/./, '']
    ] } });
    function logStarts(model, from) {
      const out = [];
      for (let l = from; l <= model.getLineCount(); l++) if (logEntry.test(model.getLineContent(l))) out.push(l);
      return out;
    }
    monaco.languages.registerFoldingRangeProvider('log', { provideFoldingRanges: function (model) {
      const s = logStarts(model, 1), ranges = [];
      for (let i = 0; i < s.length; i++) {
        const end = (i + 1 < s.length ? s[i + 1] : model.getLineCount() + 1) - 1;
        if (end > s[i]) ranges.push({ start: s[i], end: end });
      }
      return ranges;
    } });
    // Folds the entries starting at or after line `from` once the folding model has their ranges.
    function foldEntries(key, from) {
      setTimeout(function () {
        const m = models[key];
        if (!m || key !== current || m.getLanguageId() !== 'log') return;
        const lines = logStarts(m, from);
        if (lines.length) ed.trigger('wakil', 'editor.fold', { selectionLines: lines.map(function (l) { return l - 1; }), levels: 1 });
      }, 60);
    }
    // 3b-v: the settings' options. Tabs are a fallback: each model detects its own indentation
    // and uses these only where it cannot (a file's own indentation wins).
    let opts = { fontSize: 12, wordWrap: false, tabSize: 4, insertSpaces: true };
    // Monaco's model service re-runs detection on its models with the configured editor.tabSize
    // and editor.insertSpaces whenever any editor option changes (a contribution's own
    // updateOptions shortly after a model is shown is enough). So the fallback goes into the
    // editor's configuration too, or that re-run puts every model back on 4 spaces; indent()
    // still applies it at once to a model just made and to every model on a change.
    function indent(m) { m.detectIndentation(opts.insertSpaces, opts.tabSize); }
    window.wakilSetOptions = function (o) {
      const was = opts;
      opts = o;
      ed.updateOptions({ fontSize: o.fontSize, wordWrap: o.wordWrap ? 'on' : 'off',
                         tabSize: o.tabSize, insertSpaces: o.insertSpaces });
      diff.updateOptions({ fontSize: o.fontSize, wordWrap: o.wordWrap ? 'on' : 'off' });
      // Only a changed fallback re-detects: a font or wrap change must not undo an indentation
      // the operator set by hand on a model.
      if (was.tabSize !== o.tabSize || was.insertSpaces !== o.insertSpaces) {
        Object.keys(models).forEach(function (k) { indent(models[k]); });
      }
    };
    // Not mid-apply: the app's own text lands first, then one report says where it left the view.
    function report() {
      if (!current || applying) return;
      const pos = ed.getPosition(), sel = ed.getSelection(), vr = ed.getVisibleRanges();
      post({ type: 'view', key: current,
             cursor: pos ? { line: pos.lineNumber, column: pos.column } : { line: 1, column: 1 },
             selection: (sel && !sel.isEmpty()) ? { start: { line: sel.startLineNumber, column: sel.startColumn },
                                                    end: { line: sel.endLineNumber, column: sel.endColumn } } : null,
             visible: vr.length ? { first: vr[0].startLineNumber, last: vr[vr.length - 1].endLineNumber } : null,
             scrollTop: ed.getScrollTop() });
    }
    ed.onDidChangeModelContent(function () {
      if (applying || !current) return;
      conflictCaret = null;   // typed over: an Accept still on its way places no cursor
      if (typingTimer !== null) cancelAnimationFrame(typingTimer);
      const key = current;
      typingTimer = requestAnimationFrame(function () {
        typingTimer = null;
        if (models[key]) post({ type: 'text', key: key, text: models[key].getValue(), basis: basis[key] || 0 });
      });
    });
    ed.onDidChangeCursorSelection(report);
    ed.onDidScrollChange(function (e) { if (e.scrollTopChanged) report(); });
    // 3b-iii: the peek — one view zone under a hunk, its old lines muted over its new ones in green.
    // Its buttons post back; the app dispatches (editor_peek_step / _close, and Revert's edit).
    // The zone only makes room; the peek itself is an overlay widget laid over it, as Monaco's own
    // peek is. Content inside a view zone sits under the text layer, so its buttons never got a
    // click (3b-iii walk).

      if (!drafting) {

          reviewFocusField = b.thread;
          redrawReviews(key);

        row.appendChild(reply);
      }

      // **Agent on it**, which opens that conversation, as its chip does.
      if (b.handed) {
        row.appendChild(reviewButton(node, 'Agent on it', 'Agent on it', function () {
          reviewPost(key, b.thread, 'agent');
        }));
      } else {
        row.appendChild(reviewButton(node, 'Hand to agent', 'Agent', function () {
          reviewPost(key, b.thread, 'handoff');
        }));
      }

        reviewPost(key, b.thread, 'resolve');
      }));
      card.appendChild(row);
      return node;
    }
    // The waiting threads' lines on the key's model: a faint amber wash and a gutter dot. On the

    function decorateReviews(key) {
      const m = reviewModel(key);

      const lines = m.getLineCount();

        .map(function (b) {
