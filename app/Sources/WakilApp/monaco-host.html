<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body,#d{margin:0;height:100%;background:#0b0d14}
#dd{position:absolute;inset:0;display:none;background:#0b0d14}
.wakil-mark-added{border-left:3px solid #8be0c8;margin-left:4px}
.wakil-mark-changed{border-left:3px solid #e8b45a;margin-left:4px}
.wakil-mark-deletedBelow,.wakil-mark-deletedAbove{position:relative}
.wakil-mark-deletedBelow::after,.wakil-mark-deletedAbove::after{content:'';position:absolute;left:3px;border:4px solid transparent;border-left-color:rgba(232,236,246,.45)}
.wakil-mark-deletedBelow::after{bottom:-4px}
.wakil-mark-deletedAbove::after{top:-4px}
.wakil-peek{pointer-events:auto;background:#11141e;border-top:1px solid #2a2f40;border-bottom:1px solid #2a2f40;font:12px Menlo,monospace}
.wakil-peek-head{display:flex;gap:10px;padding:2px 8px;color:rgba(232,236,246,.62);font-size:11px}
.wakil-peek-head button{all:unset;cursor:pointer;white-space:nowrap;color:rgba(232,236,246,.9)}
.wakil-peek-old{color:rgba(232,236,246,.45);padding-left:8px;white-space:pre}
.wakil-peek-new{color:#8be0c8;padding-left:8px;white-space:pre}
/* 3b-viii: the dot that pulses at the caret while a slow ghost-text request waits (the ghost's own
   ink is the theme's editorGhostText.foreground: Monaco's !important rule loads after this sheet). */
.ghost-pending{position:relative}
.ghost-pending::after{content:'';position:absolute;left:1px;top:45%;width:2px;height:2px;border-radius:50%;background:rgba(232,236,246,0.34);animation:ghost-pulse 1s ease-in-out infinite}
@keyframes ghost-pulse{0%,100%{opacity:.25}50%{opacity:1}}
/* 3a-v-a: inline blame, dim, after the cursor line's text. */
.wakil-blame{color:rgba(232,236,246,.32)!important;font-style:normal;cursor:default}
/* 3a-v-b: a conflict block — current green, incoming blue, its marker lines stronger and each with a
   dim suffix — and the actions row above it, laid over a one-line view zone as the peek is. */
.wakil-conflict-current-head{background:rgba(139,224,200,.24)}
.wakil-conflict-current{background:rgba(139,224,200,.10)}
.wakil-conflict-incoming{background:rgba(92,157,255,.10)}
.wakil-conflict-incoming-head{background:rgba(92,157,255,.24)}
.wakil-conflict-label{color:rgba(232,236,246,.38)!important;font-style:normal}
.wakil-conflict-row{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:0 8px;color:rgba(232,236,246,.38);font:11px Menlo,monospace}
.wakil-conflict-row button{all:unset;cursor:pointer;white-space:nowrap;color:rgba(232,236,246,.72)}
.wakil-conflict-row button:hover{color:#e8ecf6}
</style></head>
<body><div id="d"></div>
<script>
  // Diagnostics: errors and warnings from the page
  // (Monaco's worker fallback, a failed module load) reach the app as
  // {type:'log'} instead of vanishing into an uninspectable web view.
  (function () {
    function post(level, text) {
      try { window.webkit.messageHandlers.wakil.postMessage({ type: 'log', level: level, text: String(text) }); } catch (e) {}
    }
    function fmt(args) {
      return Array.prototype.map.call(args, function (a) {
        if (a instanceof Error) return a.name + ': ' + a.message + (a.stack ? '\n' + a.stack : '');
        if (typeof a === 'object') { try { return JSON.stringify(a); } catch (e) { return String(a); } }
        return String(a);
      }).join(' ');
    }
    window.onerror = function (msg, src, line, col, err) {
      post('error', 'onerror: ' + msg + ' at ' + src + ':' + line + ':' + col + (err && err.stack ? '\n' + err.stack : ''));
    };
    window.addEventListener('unhandledrejection', function (e) {
      post('error', 'unhandledrejection: ' + fmt([e.reason]));
    });
    ['error', 'warn'].forEach(function (level) {
      const orig = console[level];
      console[level] = function () { post(level, fmt(arguments)); return orig.apply(console, arguments); };
    });
    window.wakilLog = post;
    post('info', 'page script started');
  })();
</script>
<script>
  // Monaco's diff runs in a web worker. A file: page has origin "null", so
  // the loader cannot resolve the worker's relative URL and Monaco falls back
  // to computing diffs on the main thread. Hand it a same-origin blob worker
  // that sets its base URL and imports workerMain.js by absolute file URL.
  (function () {
    const base = new URL('monaco/', location.href).href;
    self.MonacoEnvironment = {
      getWorkerUrl: function () {
        const src = 'self.MonacoEnvironment = { baseUrl: ' + JSON.stringify(base) + ' };\n' +
          'importScripts(' + JSON.stringify(base + 'vs/base/worker/workerMain.js') + ');';
        return URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      }
    };
  })();
</script>
<script src="monaco/vs/loader.js"></script>
<script>
  require.config({ paths: { vs: 'monaco/vs' } });
  require(['vs/editor/editor.main'], function () {
    monaco.editor.defineTheme('wakil', {
      base: 'vs-dark', inherit: true, rules: [
        // 3b-vii: a log's levels, in §5's red and amber; its timestamps and traces dimmed.
        { token: 'log-time', foreground: '7d8396' },
        { token: 'log-trace', foreground: '7d8396' },
        { token: 'log-error', foreground: 'e85c5c' },
        { token: 'log-warn', foreground: 'e8b45a' }
      ],
      colors: {
        'editor.background': '#0b0d14',
        'diffEditor.insertedTextBackground': '#8be0c82a',
        'diffEditor.insertedLineBackground': '#8be0c814',
        'diffEditor.removedTextBackground': '#c9a0a024',
        'diffEditor.removedLineBackground': '#c9a0a012',
        // §5's find bar (3b-ii): Wakil's slab, hairlines and violet, not vs-dark's blue.
        'editorWidget.background': '#11141e',
        'editorWidget.border': '#2a2f40',
        'input.background': '#0b0d14',
        'input.foreground': '#e8ecf6',
        'input.border': '#2a2f40',
        'inputOption.activeBorder': '#7c5cff',
        'inputOption.activeBackground': '#7c5cff33',
        'focusBorder': '#7c5cff',
        'editor.findMatchBackground': '#7c5cff55',
        'editor.findMatchHighlightBackground': '#7c5cff26',
        'editor.findRangeHighlightBackground': '#7c5cff14',
        // 3b-viii: ghost-text in §5's dim ink, rgba(232,236,246,0.34).
        'editorGhostText.foreground': '#e8ecf657'
      }
    });
    // One editable editor, one model per tab key, each keeping its own undo, and (3b-iii) the
    // pane's diff editor beside it. The app's own edits land with `applying` set, so they are not
    // reported back as typing.
    const post = function (m) { window.webkit.messageHandlers.wakil.postMessage(m); };
    const ed = monaco.editor.create(document.getElementById('d'), {
      theme: 'wakil', automaticLayout: true, minimap: { enabled: false },
      fontFamily: 'Menlo, monospace', fontSize: 12, model: null, lineDecorationsWidth: 10,
      inlineSuggest: { enabled: true, mode: 'subword' }
    });
    // 3b-iii: the pane's diff editor, in the same page as the code editor — a diff tab and Compare
    // show here. The active tab chooses which is visible; no second page is ever loaded.
    const codeHost = document.getElementById('d');
    const dd = document.createElement('div'); dd.id = 'dd'; document.body.appendChild(dd);
    const diff = monaco.editor.createDiffEditor(dd, {
      theme: 'wakil', readOnly: true, originalEditable: false, renderSideBySide: false,
      automaticLayout: true, minimap: { enabled: false }, fontFamily: 'Menlo, monospace', fontSize: 12
    });
    const dme = diff.getModifiedEditor();
    let diffKey = null;        // what the diff editor shows; null while the code editor is visible or mid-swap
    let diffScroll = null;     // re-applied once a shown diff is computed (its view zones move it)
    diff.onDidUpdateDiff(function () {
      if (diffScroll === null) return;
      const top = diffScroll;
      dme.setScrollTop(top);
      diffScroll = null;
      reportDiff();
    });
    // The diff's cursor and scroll, under its key: the window's open-file command opens the file at
    // the cursor's line, and a tab shown again lands where it was left. The visible lines go with
    // them (the store keeps a scroll only beside them). A scroll still waiting for the diff to be
    // computed is reported as the one it will be, never the top it passes through.
    function reportDiff() {
      if (!diffKey) return;
      const p = dme.getPosition(), sel = dme.getSelection(), vr = dme.getVisibleRanges();
      post({ type: 'view', key: diffKey, cursor: p ? { line: p.lineNumber, column: p.column } : { line: 1, column: 1 },
             // 3a-ii-b: the primary selection, which enables Stage / Unstage Selected Ranges.
             selection: (sel && !sel.isEmpty()) ? { start: { line: sel.startLineNumber, column: sel.startColumn },
                                                    end: { line: sel.endLineNumber, column: sel.endColumn } } : null,
             visible: vr.length ? { first: vr[0].startLineNumber, last: vr[vr.length - 1].endLineNumber } : null,
             scrollTop: diffScroll !== null ? diffScroll : dme.getScrollTop() });
    }
    dme.onDidChangeCursorPosition(reportDiff);
    dme.onDidChangeCursorSelection(reportDiff);
    // 3a-ii-b: every selection of the diff's modified side, read when Stage / Unstage Selected
    // Ranges is pressed (ruling R1); a caret is a one-line selection.
    function diffSelections() {
      return (dme.getSelections() || []).map(function (s) {
        return { startLine: s.startLineNumber, startColumn: s.startColumn, endLine: s.endLineNumber, endColumn: s.endColumn };
      });
    }
    window.wakilDiffSelections = function () { return JSON.stringify(diffSelections()); };
    // The right-click entries, shown on the group each one takes: a diff tab's key is
    // `diff:<group>:<root>/<path>` (EditorRenderer's key), so the group is read off it.
    const onChangedDiff = dme.createContextKey('wakilChangedDiff', false);
    const onStagedDiff = dme.createContextKey('wakilStagedDiff', false);
    function rangesAction(id, label, when, op) {
      dme.addAction({ id: id, label: label, precondition: when, contextMenuGroupId: 'navigation', contextMenuOrder: 0,
                      run: function () { if (diffKey) post({ type: 'ranges', key: diffKey, op: op, selections: diffSelections() }); } });
    }
    rangesAction('wakil.stageRanges', 'Stage Selected Ranges', 'wakilChangedDiff', 'stage');
    rangesAction('wakil.unstageRanges', 'Unstage Selected Ranges', 'wakilStagedDiff', 'unstage');
    dme.onDidScrollChange(function (e) { if (e.scrollTopChanged) reportDiff(); });
    function showCode() { dd.style.display = 'none'; codeHost.style.display = 'block'; diffKey = null; }
    // The same key again (a refresh) keeps the diff's own cursor and scroll; another key lands at the
    // tab's (line, column, top). `diffKey` is null across the swap, so the fresh models' reset to 1:1
    // is reported under neither key; then one report says where the new key's view is.
    window.wakilShowDiff = function (key, original, modified, language, line, column, top) {
      ed.changeViewZones(function (acc) { dropPeek(acc); dropConflictRows(acc); });
      const same = key === diffKey;
      const at = same ? dme.getPosition() : { lineNumber: line, column: column };
      const scroll = same ? (diffScroll !== null ? diffScroll : dme.getScrollTop()) : top;
      diffKey = null;
      const old = diff.getModel();
      diff.setModel({ original: monaco.editor.createModel(original, language),
                      modified: monaco.editor.createModel(modified, language) });
      if (old) { old.original.dispose(); old.modified.dispose(); }
      current = null;          // the code editor reports nothing while it is hidden
      codeHost.style.display = 'none';
      dd.style.display = 'block';
      diff.layout();
      const m = diff.getModel().modified;
      const ln = Math.min(Math.max(at ? at.lineNumber : 1, 1), m.getLineCount());
      dme.setPosition({ lineNumber: ln, column: Math.min(Math.max(at ? at.column : 1, 1), m.getLineMaxColumn(ln)) });
      dme.setScrollTop(scroll);
      diffScroll = scroll;
      diffKey = key;
      onChangedDiff.set(key.indexOf('diff:changed:') === 0);
      onStagedDiff.set(key.indexOf('diff:staged:') === 0);
      reportDiff();
    };
    // The keys the app asks for (editorCapturedKeys), taken before Monaco's own and posted back.
    let captured = [];
    window.wakilCaptureKeys = function (keys) { captured = keys; };
    window.addEventListener('keydown', function (e) {
      if (!captured.length || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
      const key = { ArrowUp: 'up', ArrowDown: 'down', Escape: 'escape' }[e.key];
      if (!key || captured.indexOf(key) < 0) return;
      e.preventDefault();
      e.stopPropagation();
      post({ type: 'key', key: key });
    }, true);
    const models = {};          // key -> model
    // The tab key a model is shown under (a rename moves the model to its new key, wakilRekey).
    function keyOfModel(model) {
      for (const k in models) if (models[k] === model) return k;
      return null;
    }
    let current = null;         // key shown in the code editor
    let applying = false;       // true while the app's own edit lands: not reported back as typing
    let typingTimer = null;
    // key -> the agent-edit serial this page has applied (wakilSetBasis, queued right after the
    // edit itself), posted with the text so the store can drop a post made before an edit landed.
    const basis = {};
    // 3b-vii: Laravel-style logs. An entry starts at a [date time] line and runs to the next.
    const logEntry = /^\[\d{4}-\d{2}-\d{2}[ T][^\]]*\]/;
    monaco.languages.register({ id: 'log' });
    monaco.languages.setMonarchTokensProvider('log', { tokenizer: { root: [
      [/^\[\d{4}-\d{2}-\d{2}[ T][^\]]*\]/, 'log-time'],
      [/\.(EMERGENCY|ALERT|CRITICAL|ERROR):/, 'log-error'],
      [/\.WARNING:/, 'log-warn'],
      [/^(#\d+ |\[stacktrace\]).*$/, 'log-trace'],
      [/[^\[.#]+/, ''],
      [/./, '']
    ] } });
    function logStarts(model, from) {
      const out = [];
      for (let l = from; l <= model.getLineCount(); l++) if (logEntry.test(model.getLineContent(l))) out.push(l);
      return out;
    }
    monaco.languages.registerFoldingRangeProvider('log', { provideFoldingRanges: function (model) {
      const s = logStarts(model, 1), ranges = [];
      for (let i = 0; i < s.length; i++) {
        const end = (i + 1 < s.length ? s[i + 1] : model.getLineCount() + 1) - 1;
        if (end > s[i]) ranges.push({ start: s[i], end: end });
      }
      return ranges;
    } });
    // Folds the entries starting at or after line `from` once the folding model has their ranges.
    function foldEntries(key, from) {
      setTimeout(function () {
        const m = models[key];
        if (!m || key !== current || m.getLanguageId() !== 'log') return;
        const lines = logStarts(m, from);
        if (lines.length) ed.trigger('wakil', 'editor.fold', { selectionLines: lines.map(function (l) { return l - 1; }), levels: 1 });
      }, 60);
    }
    // 3b-v: the settings' options. Tabs are a fallback: each model detects its own indentation
    // and uses these only where it cannot (a file's own indentation wins).
    let opts = { fontSize: 12, wordWrap: false, tabSize: 4, insertSpaces: true };
    // Monaco's model service re-runs detection on its models with the configured editor.tabSize
    // and editor.insertSpaces whenever any editor option changes (a contribution's own
    // updateOptions shortly after a model is shown is enough). So the fallback goes into the
    // editor's configuration too, or that re-run puts every model back on 4 spaces; indent()
    // still applies it at once to a model just made and to every model on a change.
    function indent(m) { m.detectIndentation(opts.insertSpaces, opts.tabSize); }
    window.wakilSetOptions = function (o) {
      const was = opts;
      opts = o;
      ed.updateOptions({ fontSize: o.fontSize, wordWrap: o.wordWrap ? 'on' : 'off',
                         tabSize: o.tabSize, insertSpaces: o.insertSpaces });
      diff.updateOptions({ fontSize: o.fontSize, wordWrap: o.wordWrap ? 'on' : 'off' });
      // Only a changed fallback re-detects: a font or wrap change must not undo an indentation
      // the operator set by hand on a model.
      if (was.tabSize !== o.tabSize || was.insertSpaces !== o.insertSpaces) {
        Object.keys(models).forEach(function (k) { indent(models[k]); });
      }
    };
    // Not mid-apply: the app's own text lands first, then one report says where it left the view.
    function report() {
      if (!current || applying) return;
      const pos = ed.getPosition(), sel = ed.getSelection(), vr = ed.getVisibleRanges();
      post({ type: 'view', key: current,
             cursor: pos ? { line: pos.lineNumber, column: pos.column } : { line: 1, column: 1 },
             selection: (sel && !sel.isEmpty()) ? { start: { line: sel.startLineNumber, column: sel.startColumn },
                                                    end: { line: sel.endLineNumber, column: sel.endColumn } } : null,
             visible: vr.length ? { first: vr[0].startLineNumber, last: vr[vr.length - 1].endLineNumber } : null,
             scrollTop: ed.getScrollTop() });
    }
    ed.onDidChangeModelContent(function () {
      if (applying || !current) return;
      conflictCaret = null;   // typed over: an Accept still on its way places no cursor
      if (typingTimer !== null) cancelAnimationFrame(typingTimer);
      const key = current;
      typingTimer = requestAnimationFrame(function () {
        typingTimer = null;
        if (models[key]) post({ type: 'text', key: key, text: models[key].getValue(), basis: basis[key] || 0 });
      });
    });
    ed.onDidChangeCursorSelection(report);
    ed.onDidScrollChange(function (e) { if (e.scrollTopChanged) report(); });
    // 3b-iii: the peek — one view zone under a hunk, its old lines muted over its new ones in green.
    // Its buttons post back; the app dispatches (editor_peek_step / _close, and Revert's edit).
    // The zone only makes room; the peek itself is an overlay widget laid over it, as Monaco's own
    // peek is. Content inside a view zone sits under the text layer, so its buttons never got a
    // click (3b-iii walk).
    let peekZone = null, peekWidget = null;
    function dropPeek(acc) {
      if (peekZone !== null) { acc.removeZone(peekZone); peekZone = null; }
      if (peekWidget !== null) { ed.removeOverlayWidget(peekWidget); peekWidget = null; }
    }
    function placePeek() {
      if (peekWidget === null) return;
      const l = ed.getLayoutInfo(), n = peekWidget.getDomNode();
      n.style.left = l.contentLeft + 'px';
      n.style.width = Math.max(0, l.contentWidth - l.verticalScrollbarWidth) + 'px';
    }
    ed.onDidLayoutChange(placePeek);
    window.wakilPeek = function (key, p) {
      ed.changeViewZones(function (acc) {
        dropPeek(acc);
        if (!p || key !== current) return;
        const node = document.createElement('div'); node.className = 'wakil-peek';
        const head = document.createElement('div'); head.className = 'wakil-peek-head';
        const title = document.createElement('span'); title.textContent = p.title; head.appendChild(title);
        [['\u2191', 'up'], ['\u2193', 'down'], ['Stage', 'stage'], ['Revert', 'revert'], ['\u00d7', 'close']].forEach(function (b) {
          const el = document.createElement('button'); el.textContent = b[0];
          el.addEventListener('mousedown', function (e) {
            e.preventDefault(); e.stopPropagation();
            post({ type: 'peek', key: key, op: b[1] });
          });
          head.appendChild(el);
        });
        node.appendChild(head);
        p.old.forEach(function (l) { const d = document.createElement('div'); d.className = 'wakil-peek-old'; d.textContent = l; node.appendChild(d); });
        p.new.forEach(function (l) { const d = document.createElement('div'); d.className = 'wakil-peek-new'; d.textContent = l; node.appendChild(d); });
        node.style.position = 'absolute';
        peekWidget = { getId: function () { return 'wakil.peek'; }, getDomNode: function () { return node; },
                       getPosition: function () { return null; } };
        ed.addOverlayWidget(peekWidget);
        placePeek();
        peekZone = acc.addZone({
          afterLineNumber: p.afterLine, heightInLines: 1 + p.old.length + p.new.length,
          domNode: document.createElement('div'),
          onDomNodeTop: function (top) { node.style.top = top + 'px'; },
          onComputedHeight: function (h) { node.style.height = h + 'px'; },
        });
      });
      if (p && key === current) ed.revealLinesInCenterIfOutsideViewport(Math.max(p.afterLine, 1), p.afterLine + 1 + p.old.length + p.new.length);
    };
    window.wakilShowModel = function (key, text, language, readOnly) {
      ed.changeViewZones(function (acc) { dropPeek(acc); dropConflictRows(acc); });
      showCode();
      const created = !models[key];
      if (created) { models[key] = monaco.editor.createModel(text, language); indent(models[key]); }
      current = key;
      conflictCaret = null;
      ed.setModel(models[key]);
      // Its tints stayed on the model; its rows (editor-level, as view zones are) come back with it.
      ed.changeViewZones(function (acc) { drawConflictRows(acc, key); });
      // 3b-vii: a log's bottom is its last line at the bottom edge, as in a terminal, so opening at
      // the bottom and following show the newest entries, not the blank space past them.
      ed.updateOptions({ readOnly: readOnly, scrollBeyondLastLine: models[key].getLanguageId() !== 'log' });
      report();
      if (created) foldEntries(key, 1);
    };
    window.wakilSetLanguage = function (key, language) { if (models[key]) monaco.editor.setModelLanguage(models[key], language); };
    window.wakilSetReadOnly = function (key, on) { if (key === current) ed.updateOptions({ readOnly: on }); };
    // The model's whole text becomes `text` as one undoable step. A keystroke still waiting for
    // its frame was typed on the text being replaced, so its post is cancelled: the store never
    // sees it (the cost the typing-race ruling accepts), and the page never drifts from the store.
    function replaceWhole(key, text) {
      const m = models[key]; if (!m) return;
      if (typingTimer !== null && key === current) { cancelAnimationFrame(typingTimer); typingTimer = null; }
      if (m.getValue() === text) return;
      applying = true;
      // The whole selection, not only the caret: a select the agent made must survive a reload.
      const sel = key === current ? ed.getSelection() : null, top = key === current ? ed.getScrollTop() : 0;
      // Its own undo step: Monaco merges back-to-back pushEditOperations into one, so ⌘Z after two
      // applies (an agent edit, then a Revert) undid both (3b-iii Cover).
      m.pushStackElement();
      m.pushEditOperations([], [{ range: m.getFullModelRange(), text: text }], function () { return null; });
      m.pushStackElement();
      if (sel) { ed.setSelection(sel); ed.setScrollTop(top); }
      applying = false;
      // One report of where the apply left the view (Monaco clamps to a shorter text).
      if (key === current) report();
    }
    window.wakilResetText = function (key, text, serial) {
      if (!models[key]) return;
      replaceWhole(key, text);
      basis[key] = serial;
    };
    // An agent edit, applied as a range only onto the text it was computed against (`before`).
    // A model holding a keystroke not yet posted is not `before`: the range would land at shifted
    // columns, so the model is replaced whole by `after`, the store's text. A result that is not
    // `after` (Monaco normalising line endings) is replaced the same way. The serial is set in
    // this same call, so no keystroke can be posted between the edit and its basis.
    // 3b-vii: a growing log. Appended as its own undo step, the new entries folded (Rule 9: an opened
    // fold stays open). Following is the store's: it moves the cursor, and the reveal step scrolls.
    window.wakilAppendText = function (key, text, serial) {
      const m = models[key]; if (!m) return;
      // A keystroke not yet posted stays pending: its post then carries the old text, the keystroke and
      // this chunk, so the store sees the tab go dirty (final review I3).
      const shown = key === current;
      const from = m.getLineCount();
      const end = m.getFullModelRange().getEndPosition();
      applying = true;
      m.pushStackElement();
      m.pushEditOperations([], [{ range: new monaco.Range(end.lineNumber, end.column, end.lineNumber, end.column), text: text }],
                           function () { return null; });
      m.pushStackElement();
      applying = false;
      basis[key] = serial;
      if (shown) {
        foldEntries(key, from);
        report();
      }
    };
    window.wakilApplyEdit = function (key, sl, sc, el, ec, text, before, after, serial) {
      const m = models[key]; if (!m) return;
      // 3a-v-b: the edit an Accept pressed here made (it starts at its block's <<<<<<< line).
      const caret = conflictCaret !== null && conflictCaret.key === key && conflictCaret.line === sl;
      if (caret) conflictCaret = null;
      if (m.getValue() !== before) {
        replaceWhole(key, after);
      } else {
        applying = true;
        m.pushStackElement();   // its own undo step, as replaceWhole's
        m.pushEditOperations([], [{ range: new monaco.Range(sl, sc, el, ec), text: text }], function () { return null; });
        m.pushStackElement();
        applying = false;
        if (m.getValue() !== after) replaceWhole(key, after);
        else if (key === current) report();
      }
      basis[key] = serial;
      // Rule 6: after an Accept the cursor stays at the block's place, the line its text now starts
      // on, wherever Monaco's own tracking would have moved it; the move reports itself.
      if (caret && key === current) {
        ed.setPosition({ lineNumber: Math.min(sl, m.getLineCount()), column: 1 });
        ed.revealLineInCenterIfOutsideViewport(sl);
      }
    };
    window.wakilReveal = function (key, line, column, sel) {
      if (key !== current) return;
      if (sel) ed.setSelection(new monaco.Range(sel[0], sel[1], sel[2], sel[3])); else ed.setPosition({ lineNumber: line, column: column });
      ed.revealLineInCenterIfOutsideViewport(line);
    };
    window.wakilSetScrollTop = function (key, top) { if (key === current) ed.setScrollTop(top); };
    window.wakilSetBasis = function (key, serial) { basis[key] = serial; };
    // 3b-iii: the gutter's change marks, as line decorations per model (WakilKit computes them).
    const marks = {};   // key -> decoration ids
    window.wakilSetMarks = function (key, list) {
      const m = models[key]; if (!m) return;
      marks[key] = m.deltaDecorations(marks[key] || [], list.map(function (x) {
        return { range: new monaco.Range(x.start, 1, x.end, 1),
                 options: { isWholeLine: true, linesDecorationsClassName: 'wakil-mark-' + x.kind } };
      }));
    };
    // 3a-v-a: inline blame. Swift fetches and picks the line; the page draws one annotation per model,
    // after the line's text, and its hover's links post back which commit was asked about.
    const blames = {};  // key -> { ids, id }
    window.wakilSetBlame = function (key, line, text, hover, id) {
      const m = models[key]; if (!m) return;
      const list = [];
      if (line > 0 && line <= m.getLineCount() && text) {
        const end = m.getLineMaxColumn(line);
        list.push({ range: new monaco.Range(line, end, line, end), options: {
          showIfCollapsed: true,
          after: { content: '\u2003\u2003' + text, inlineClassName: 'wakil-blame',
                   cursorStops: monaco.editor.InjectedTextCursorStops.None },
          hoverMessage: hover ? { value: hover, isTrusted: true } : undefined } });
      }
      blames[key] = { ids: m.deltaDecorations((blames[key] || {}).ids || [], list), id: id || '' };
    };
    // 3c-i: `web`, the hover's Open on GitHub (GitLab, Bitbucket), shown only when Swift found the page.
    // A command link hands its command no event, so ⌥ is read from the pointer press that clicked it:
    // a capture-phase mousedown runs before Monaco's own link handling. `alt` goes with `web` only.
    let pressAlt = false;
    window.addEventListener('mousedown', function (e) { pressAlt = e.altKey; }, true);
    ['open', 'copy', 'web'].forEach(function (op) {
      monaco.editor.registerCommand('wakil.blame.' + op, function () {
        const b = current && blames[current];
        if (!b || !b.id) return;
        const m = { type: 'blame', key: current, op: op, id: b.id };
        if (op === 'web') m.alt = pressAlt;
        post(m);
        pressAlt = false;
      });
    });
    // 3a-v-b: a conflicted file's blocks. WakilKit parses them from the tab's text and pushes them on
    // every change (none for a file git did not mark conflicted); the page tints them per model and
    // lays an actions row over a one-line view zone above each, as the peek's buttons are (R3): content
    // in a view zone gets no clicks. A press only posts {type:'conflict'}; the Accept itself comes back
    // from the store as an edit, one undo step (R2).
    const conflicts = {};      // key -> { ids, blocks }
    let conflictRows = [];     // the shown key's rows: [{ zone, widget }]
    let conflictCaret = null;  // { key, line }: an Accept pressed, its edit not yet applied
    function dropConflictRows(acc) {
      conflictRows.forEach(function (r) { acc.removeZone(r.zone); ed.removeOverlayWidget(r.widget); });
      conflictRows = [];
    }
    function placeConflictRows() {
      const l = ed.getLayoutInfo();
      conflictRows.forEach(function (r) {
        const n = r.widget.getDomNode();
        n.style.left = l.contentLeft + 'px';
        n.style.width = Math.max(0, l.contentWidth - l.verticalScrollbarWidth) + 'px';
        // A pane too narrow for the full labels takes the short ones, so no action is clipped out of
        // reach (3a-v-b walk); the names a reader hears stay whole.
        const buttons = n.querySelectorAll('button');
        buttons.forEach(function (el) { el.textContent = el.dataset.full; });
        if (n.scrollWidth > n.clientWidth) buttons.forEach(function (el) { el.textContent = el.dataset.short; });
      });
    }
    ed.onDidLayoutChange(placeConflictRows);
    const conflictActions = [['Accept Current Change', 'current', 'Current'],
                             ['Accept Incoming Change', 'incoming', 'Incoming'],
                             ['Accept Both Changes', 'both', 'Both'], ['Compare Changes', 'compare', 'Compare']];
    function drawConflictRows(acc, key) {
      dropConflictRows(acc);
      const c = conflicts[key];
      if (!c || key !== current) return;
      c.blocks.forEach(function (b, i) {
        const node = document.createElement('div'); node.className = 'wakil-conflict-row';
        conflictActions.forEach(function (a, j) {
          if (j) { const dot = document.createElement('span'); dot.textContent = '\u00b7'; node.appendChild(dot); }
          const el = document.createElement('button'); el.textContent = a[0];
          el.dataset.full = a[0]; el.dataset.short = a[2];
          el.setAttribute('aria-label', a[0]); el.title = a[0];
          // mousedown, not click, and the default prevented: the press never moves Monaco's cursor.
          el.addEventListener('mousedown', function (e) {
            e.preventDefault(); e.stopPropagation();
            if (!current) return;
            if (a[1] !== 'compare') conflictCaret = { key: current, line: b.start };
            post({ type: 'conflict', key: current, block: b.start, op: a[1] });
          });
          node.appendChild(el);
        });
        node.style.position = 'absolute';
        const widget = { getId: function () { return 'wakil.conflict.' + i; }, getDomNode: function () { return node; },
                         getPosition: function () { return null; } };
        ed.addOverlayWidget(widget);
        const zone = acc.addZone({
          afterLineNumber: b.start - 1, heightInLines: 1, domNode: document.createElement('div'),
          onDomNodeTop: function (top) { node.style.top = top + 'px'; },
          onComputedHeight: function (h) { node.style.height = h + 'px'; },
        });
        conflictRows.push({ zone: zone, widget: widget });
      });
      placeConflictRows();
    }
    function conflictLines(start, end, className) {
      return { range: new monaco.Range(start, 1, end, 1), options: { isWholeLine: true, className: className } };
    }
    function conflictLabel(m, line, text) {
      const end = m.getLineMaxColumn(line);
      return { range: new monaco.Range(line, end, line, end), options: { showIfCollapsed: true,
        after: { content: ' ' + text, inlineClassName: 'wakil-conflict-label',
                 cursorStops: monaco.editor.InjectedTextCursorStops.None } } };
    }
    window.wakilSetConflicts = function (key, blocks) {
      const m = models[key]; if (!m) return;
      // A block past the model's end was parsed from text the page has since moved on from.
      const shown = blocks.filter(function (b) { return b.end <= m.getLineCount(); });
      const list = [];
      shown.forEach(function (b) {
        list.push(conflictLines(b.start, b.start, 'wakil-conflict-current-head'));
        if (b.separator - 1 > b.start) list.push(conflictLines(b.start + 1, b.separator - 1, 'wakil-conflict-current'));
        if (b.end - 1 > b.separator) list.push(conflictLines(b.separator + 1, b.end - 1, 'wakil-conflict-incoming'));
        list.push(conflictLines(b.end, b.end, 'wakil-conflict-incoming-head'));
        list.push(conflictLabel(m, b.start, '(Current Change)'));
        list.push(conflictLabel(m, b.end, '(Incoming Change)'));
      });
      conflicts[key] = { ids: m.deltaDecorations((conflicts[key] || {}).ids || [], list), blocks: shown };
      if (key === current && !diffKey) ed.changeViewZones(function (acc) { drawConflictRows(acc, key); });
    };
    // 3b-viii: ghost-text. Swift owns the debounce, the model and the clean-up; the page asks
    // and draws. A resolve for an id that is no longer pending is ignored, so a stale reply never
    // lands over newer typing. Tab accepts, ⌘→ a word, Esc dismisses — Monaco's own keys; an
    // accept is an edit like a keystroke, so it reaches the app as typing (`text`).
    let ghostSeq = 0;
    // Off until Swift says it is on (wakilGhostEnabled, sent at start and on every change): while
    // off, a trigger asks nothing and posts no buffer.
    let ghostOn = false;
    window.wakilGhostEnabled = function (on) { ghostOn = !!on; };
    const ghostPending = new Map();   // id -> its resolver
    // The pulse: a request still unanswered after 400 ms shows a dot at the caret it asked from.
    let pulse = null;                 // { id, model, timer, ids }
    function endPulse(id) {
      if (!pulse || (id !== undefined && pulse.id !== id)) return;
      clearTimeout(pulse.timer);
      if (!pulse.model.isDisposed()) pulse.model.deltaDecorations(pulse.ids, []);
      pulse = null;
    }
    function startPulse(id, model, position) {
      endPulse();
      const p = { id: id, model: model, timer: null, ids: [] };
      p.timer = setTimeout(function () {
        if (pulse !== p || model.isDisposed()) return;
        p.ids = model.deltaDecorations([], [{ range: new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column),
                                             options: { afterContentClassName: 'ghost-pending' } }]);
      }, 400);
      pulse = p;
    }
    window.wakilGhostResolve = function (id, text) {
      const p = ghostPending.get(id);
      if (!p) return;
      ghostPending.delete(id);
      endPulse(id);
      p(text);
    };
    monaco.languages.registerInlineCompletionsProvider({ pattern: '**' }, {
      provideInlineCompletions: function (model, position, context, token) {
        if (!ghostOn || model !== ed.getModel() || ed.getOption(monaco.editor.EditorOption.readOnly)) return { items: [] };
        const key = keyOfModel(model);
        if (!key) return { items: [] };
        const id = ++ghostSeq;
        const offset = model.getOffsetAt(position);
        return new Promise(function (resolve) {
          ghostPending.set(id, function (text) {
            resolve({ items: text ? [{ insertText: text, range: new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column) }] : [] });
          });
          token.onCancellationRequested(function () {
            if (ghostPending.delete(id)) { endPulse(id); post({ type: 'ghostCancel', id: id }); resolve({ items: [] }); }
          });
          startPulse(id, model, position);
          post({ type: 'ghost', key: key, id: id, text: model.getValue(), offset: offset });
        });
      },
      freeInlineCompletions: function () {}
    });
    // A click on a mark opens the peek on its hunk (editor_peek).
    ed.onMouseDown(function (e) {
      if (!current || !e.target || e.target.type !== monaco.editor.MouseTargetType.GUTTER_LINE_DECORATIONS) return;
      post({ type: 'mark', key: current, line: e.target.position.lineNumber });
    });
    window.wakilDispose = function (key) {
      if (current === key) ed.changeViewZones(dropConflictRows);
      if (models[key]) { models[key].dispose(); delete models[key]; }
      delete basis[key]; delete marks[key]; delete blames[key]; delete conflicts[key];
      if (current === key) current = null;
    };
    // A renamed tab (3b-iv R2): its model, undo history and marks move to the new key.
    window.wakilRekey = function (from, to) {
      [models, basis, marks, blames, conflicts].forEach(function (m) { if (from in m) { m[to] = m[from]; delete m[from]; } });
      if (current === from) current = to;
    };
    window.wakilFocus = function () { if (diffKey) dme.focus(); else ed.focus(); };
    // Monaco's find bar (3b-ii). Its state — query, switches, count, open — goes back to the app on
    // every change, as the cursor's does: the pane's find record and read_pane's `find` read it.
    const findCtl = ed.getContribution('editor.contrib.findController');
    function reportFind() {
      if (!current || !findCtl) return;
      const st = findCtl.getState();
      post({ type: 'find', query: st.searchString, matchCase: st.matchCase, wholeWord: st.wholeWord,
             isRegex: st.isRegex, count: st.matchesCount, shown: st.isRevealed });
    }
    if (findCtl) findCtl.getState().onFindReplaceStateChange(reportFind);
    // The agent's editor_find: the bar opens on its query, switches set, the first match revealed.
    window.wakilFind = function (key, q, matchCase, wholeWord, isRegex) {
      if (key !== current || !findCtl) return;
      // start() first: it makes the bar on the first find, and a bar made after the state already
      // says revealed never shows itself — nor on any later ⌘F, which then changes nothing.
      findCtl.start({ forceRevealReplace: false, seedSearchStringFromSelection: 'none',
                      seedSearchStringFromNonEmptySelection: false, seedSearchStringFromGlobalClipboard: false,
                      shouldFocus: 0, shouldAnimate: true, updateSearchScope: false, loop: true });
      findCtl.getState().change({ searchString: q, matchCase: matchCase, wholeWord: wholeWord,
                                  isRegex: isRegex, isRevealed: true }, false);
      findCtl.moveToNextMatch();
      // Always report: the app cleared its find record for this request, and a request matching
      // what the bar already shows (same query, same switches) changes no state, so no change
      // event would ever report it again.
      reportFind();
    };
    // ⌘S, ⌘T, ⌘W, ⌘P, ⌘K, ⌘B, ⌘⏎ (Maximize Pane), ⌘⇧F and ⌘⇧G are the window's menu commands:
    // un-prevented, so WebKit hands them back; Monaco's own ⌘⏎ (insert line below) gives way.
    // Monaco keeps ⌘F, ⌘G and ⌥⌘F (its find bar); its Find Previous keeps ⇧⏎ in the bar. By physical key (`code`), not `key`: on an
    // Arabic layout ⌘K arrives as 'ك'. The plain keys pass only unshifted (⌘⇧⏎ stays Monaco's):
    // no menu command uses ⇧ with them today, and one that does needs its own entry here.
    window.addEventListener('keydown', function (e) {
      if (!e.metaKey || e.ctrlKey || e.altKey) return;
      const plain = ['KeyS', 'KeyT', 'KeyW', 'KeyP', 'KeyK', 'KeyB', 'Enter'].indexOf(e.code) >= 0 && !e.shiftKey;
      const searchFiles = e.code === 'KeyF' && e.shiftKey;
      const changes = e.code === 'KeyG' && e.shiftKey;   // ⌘⇧G is the window's Changes view (3b-iii)
      if (plain || searchFiles || changes) { e.stopPropagation(); }
    }, true);
    post({ type: 'ready' });
  });
</script></body></html>
